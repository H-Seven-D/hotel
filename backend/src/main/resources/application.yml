server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: homestay-booking
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/homestay_booking?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

app:
  dev:
    auto-start-frontend: ${AUTO_START_FRONTEND:true}
  jwt:
    secret: ${JWT_SECRET:homestay-booking-graduation-project-jwt-secret-2026}
    expiration-hours: 12

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.homestay: info
